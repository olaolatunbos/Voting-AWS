name: Worker Image Push

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'voting-app/worker/**'
  push:
    branches: [main]
    paths:
      - 'voting-app/worker/**'


permissions:
  contents: write
  pull-requests: read
  id-token: write


concurrency:
  group: worker-image-push
  cancel-in-progress: false

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voting-app/worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Formatting
        # google-java-format, AOSP style; `mvn spotless:apply` fixes locally.
        run: mvn -B spotless:check

      - name: Linting
        # SpotBugs analyses bytecode, so the classes have to exist first.
        run: mvn -B compile spotbugs:check

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: voting-app/worker/target/spotbugsXml.xml

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voting-app/worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests with coverage
        run: mvn -B test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            voting-app/worker/target/site/jacoco/
            voting-app/worker/target/surefire-reports/

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Full history so gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0

      - name: Dependency audit (Trivy)
        # Resolves the Maven tree from pom.xml. Reports only — the image scan in
        # docker-build is the gate; this one surfaces fixable library CVEs.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: voting-app/worker
          scanners: vuln
          format: table
          output: dependency-audit-report.txt
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-report
          path: dependency-audit-report.txt

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build image
        run: docker build -t voting-app/worker:${{ github.sha }} ./voting-app/worker

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voting-app/worker:${{ github.sha }}
          format: table
          output: trivy-results.txt
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-scan
          path: trivy-results.txt


  docker-push:
    name: Push to ECR
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      REPOSITORY: voting-app/worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail

          # grep is allowed to find nothing — that is just an empty repository,
          # which starts the sequence at v1.0.0. Without the guard, pipefail
          # turns its exit 1 into a failed run.
          CURRENT=$(aws ecr list-images \
            --repository-name "$REPOSITORY" \
            --filter tagStatus=TAGGED \
            --query 'imageIds[].imageTag' \
            --output text \
            | tr '[:space:]' '\n' \
            | { grep -E '^v[0-9]+\.0\.0$' || true; } \
            | sed 's/^v//; s/\.0\.0$//' \
            | sort -n \
            | tail -1)

          echo "tag=v$(( ${CURRENT:-0} + 1 )).0.0" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $REGISTRY/$REPOSITORY:${{ github.sha }} \
            -t $REGISTRY/$REPOSITORY:latest \
            ./voting-app/worker

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$REPOSITORY:latest

          echo "Pushed $REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Update manifest image tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-manifest.sh worker "$REPOSITORY" "${{ steps.version.outputs.tag }}"



