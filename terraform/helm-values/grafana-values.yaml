# Sets Grafana's own idea of its address, not just the Ingress host, so that
# redirects and generated share links do not point at the in-cluster Service.
grafana.ini:
  server:
    root_url: https://grafana.olaolat.com

service:
  type: ClusterIP

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - grafana.olaolat.com
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.olaolat.com

# Without this the pod is backed by emptyDir and every restart wipes anything
# created through the UI. Dashboards defined in code below survive either way;
# ad-hoc ones do not.
persistence:
  enabled: true
  size: 10Gi
  # storageClass unset — inherits the cluster default gp3 class.

# adminPassword is deliberately absent here: helm-charts.tf injects one via
# set_sensitive so it is not a plaintext string in the repo. Leaving it unset
# entirely is not the same thing — the chart then generates its own on each
# render, which is not stable across upgrades the way a tracked value is.
adminUser: admin

# Provisioned at startup from this file rather than clicked in, so a rebuilt
# Grafana comes back already pointed at Prometheus. The host is the Service the
# prometheus chart creates: <release>-server in the same namespace.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

# Tells the sidecar where to look; the dashboards themselves come from
# dashboards: below. Both halves are needed for the folder to appear.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Pulled from grafana.com at pod start, which means the cluster needs egress
# (it has it, via the NAT gateway). Pinned by revision so a dashboard author's
# later edit cannot change what this cluster renders.
dashboards:
  default:
    kubernetes-cluster:
      # "Kubernetes / Compute Resources / Cluster"
      gnetId: 315
      revision: 3
      datasource: Prometheus
    node-exporter:
      # "Node Exporter Full"
      gnetId: 1860
      revision: 37
      datasource: Prometheus

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
