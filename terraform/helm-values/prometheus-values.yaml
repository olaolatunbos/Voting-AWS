# ClusterIP only, no Ingress. Prometheus ships no authentication of its own,
# and its API can read every metric in the cluster as well as reload config.
# Reach it with:
#   kubectl -n monitoring port-forward svc/prometheus-server 9090:80
# Grafana talks to it in-cluster, so nothing here needs to be public.

server:
  service:
    type: ClusterIP
    servicePort: 80

  # Beyond this the volume below has to grow with it.
  retention: 15d

  persistentVolume:
    enabled: true
    size: 20Gi
    # storageClass left unset on purpose: it falls through to the cluster
    # default, which is the gp3 class in kubernetes.tf. Naming it here would
    # duplicate that decision in two places.

  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

alertmanager:
  enabled: true
  persistence:
    size: 2Gi

# Pushgateway is for batch jobs that exit before Prometheus can scrape them.
# Nothing here pushes, and leaving it on adds a permanent staleness trap:
# metrics pushed once are served forever until explicitly deleted.
prometheus-pushgateway:
  enabled: false

# Both on by default and both wanted — kube-state-metrics supplies the
# Deployment/Pod/Node object metrics that most Grafana dashboards are built on,
# node-exporter the per-host CPU, memory, disk and network series.
kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
