apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: 801497981564.dkr.ecr.eu-west-2.amazonaws.com/voting-app/result:v2.0.0
        name: result
        ports:
        - containerPort: 80
          name: result
