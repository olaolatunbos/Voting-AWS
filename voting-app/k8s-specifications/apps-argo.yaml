apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps                
  namespace: argocd 

spec:
  project: default            
  source:
    repoURL: https://github.com/olaolatunbos/Voting-AWS.git
    targetRevision: HEAD      
    path: voting-app/k8s-specifications/app

  destination:
    server: https://kubernetes.default.svc  
    namespace: default  
                 
  syncPolicy:
    automated:
      prune: true        
      selfHeal: true        
    syncOptions:
      - CreateNamespace=true  