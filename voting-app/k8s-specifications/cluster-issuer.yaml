apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod

spec:
  acme:
    email: aoolatunbosun@outlook.com

    server: https://acme-staging-v02.api.letsencrypt.org/directory

    privateKeySecretRef:
      name: letsencrypt-prod-key

    solvers:
    - dns01:
        route53:
          region: eu-west-2
          hostedZoneID: Z07845832PA7LU4WK4CO
      selector:
        dnsZones:
        - "olaolat.com"
    - http01:
        ingress:
          class: nginx
